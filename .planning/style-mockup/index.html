<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chọn style art</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg-window: #ececf0; --bg-sidebar: #e8e8ed; --bg-content: #fbfbfd; --bg-elevated: #fff; --bg-sunken: #f2f2f6;
  --text: #1d1d1f; --text-2: #5e5e66; --text-3: #6e6e77; --separator: rgba(0,0,0,.09);
  --accent: #6e56cf; --accent-soft: rgba(110,86,207,.12);
  --hairline: 0 0 0 .5px rgba(0,0,0,.12); --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --checker: #e9e9ee;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-window: #1c1c1e; --bg-sidebar: #242428; --bg-content: #1e1e21; --bg-elevated: #2a2a2e; --bg-sunken: #18181a;
    --text: #f5f5f7; --text-2: #a8a8b0; --text-3: #93939c; --separator: rgba(255,255,255,.08);
    --accent: #9e8cfc; --accent-soft: rgba(158,140,252,.16);
    --hairline: 0 0 0 .5px rgba(255,255,255,.1); --shadow: 0 1px 2px rgba(0,0,0,.3); --checker: #26262a;
  }
}
:root[data-theme="dark"] {
  --bg-window: #1c1c1e; --bg-sidebar: #242428; --bg-content: #1e1e21; --bg-elevated: #2a2a2e; --bg-sunken: #18181a;
  --text: #f5f5f7; --text-2: #a8a8b0; --text-3: #93939c; --separator: rgba(255,255,255,.08);
  --accent: #9e8cfc; --accent-soft: rgba(158,140,252,.16);
  --hairline: 0 0 0 .5px rgba(255,255,255,.1); --shadow: 0 1px 2px rgba(0,0,0,.3); --checker: #26262a;
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 Inter, "Segoe UI", sans-serif; background: var(--bg-content); color: var(--text); }
header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  padding: 12px 24px; background: color-mix(in srgb, var(--bg-content) 88%, transparent); backdrop-filter: blur(12px);
  border-bottom: .5px solid var(--separator); }
h1 { font-size: 17px; margin: 0 12px 0 0; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--bg-sunken); box-shadow: var(--hairline); }
.seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--text);
  font: inherit; font-weight: 500; cursor: pointer; }
.seg button.on { background: var(--bg-elevated); box-shadow: var(--shadow), var(--hairline); font-weight: 600; }
.kbd { color: var(--text-3); font-size: 12px; margin-left: auto; }
main { max-width: 1040px; margin: 0 auto; padding: 24px; display: grid; gap: 32px; }
.label { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 10px; }
.note { color: var(--text-2); margin: -4px 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
.rcard { display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 12px; background: var(--bg-elevated);
  box-shadow: var(--shadow), var(--hairline); text-align: left; }
.art { flex: none; width: 76px; height: 76px; border-radius: 12px; overflow: hidden; background: var(--bg-sunken); display: grid; place-items: center; }
.art img { width: 100%; height: 100%; object-fit: cover; }
.name { font-weight: 600; font-size: 15px; }
.pitch { color: var(--text-2); font-size: 13px; margin-top: 2px; }
.lanes { display: flex; gap: 4px; margin-top: 6px; }
.lane { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 5px; color: var(--text-2); background: var(--bg-sunken); box-shadow: var(--hairline); }
.tiles { display: flex; gap: 12px; flex-wrap: wrap; }
.tile { width: 128px; }
.tile .img { width: 128px; height: 128px; border-radius: 10px; overflow: hidden; box-shadow: var(--hairline);
  background: conic-gradient(var(--checker) 25%, transparent 0 50%, var(--checker) 0 75%, transparent 0) 0 0 / 16px 16px; }
.tile img { width: 100%; height: 100%; object-fit: cover; }
.tile b { display: block; font-size: 13px; margin-top: 6px; }
.tile span { font-size: 12px; color: var(--text-3); }
.big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.big img { width: 100%; border-radius: 14px; box-shadow: var(--hairline); display: block; }
.all { display: grid; gap: 14px; }
.all-row { display: grid; grid-template-columns: 150px repeat(3, 1fr); gap: 10px; align-items: center; padding: 10px;
  border-radius: 12px; background: var(--bg-elevated); box-shadow: var(--hairline); cursor: pointer; }
.all-row.on { box-shadow: 0 0 0 2px var(--accent); }
.all-row img { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; }
.all-row .t { font-weight: 600; }
.all-row .d { font-size: 12px; color: var(--text-2); }
.pick { padding: 14px 16px; border-radius: 12px; background: var(--accent-soft); color: var(--text); }
.pick b { color: var(--accent); }
@media (max-width: 640px) {
  header { padding: 10px 16px; } main { padding: 16px; }
  .big { grid-template-columns: 1fr; } .all-row { grid-template-columns: 1fr 1fr 1fr; } .all-row > div:first-child { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<header>
  <h1>Chọn style art</h1>
  <div class="seg" id="styles" role="radiogroup" aria-label="Style"></div>
  <div class="seg" id="theme" role="radiogroup" aria-label="Giao diện">
    <button data-t="system" class="on">Theo máy</button><button data-t="light">Sáng</button><button data-t="dark">Tối</button>
  </div>
  <span class="kbd">Phím 0–4 đổi style</span>
</header>
<main>
  <div class="pick" id="pick"></div>

  <section>
    <p class="label">Màn Tạo mới · thẻ quy trình (76px)</p>
    <div class="grid" id="cards"></div>
  </section>

  <section>
    <p class="label">Tổng quan · Gần đây (128px)</p>
    <div class="tiles" id="tiles"></div>
  </section>

  <section>
    <p class="label">Xem lớn</p>
    <div class="big" id="big"></div>
  </section>

  <section>
    <p class="label">So cả 5 cạnh nhau (bấm 1 hàng để chọn)</p>
    <div class="all" id="all"></div>
  </section>
</main>
<script>
const STYLES = [
  ['0_now', 'Hiện tại', '3D clay bóng, tím đậm (đang dùng)'],
  ['A_glyph', 'A · Glyph', 'Nét đơn sắc kiểu SF Symbols trên ô bo góc'],
  ['B_pixel', 'B · Pixel', 'Pixel art 32px, viền đậm'],
  ['C_diorama', 'C · Diorama', 'Low-poly isometric trên đế, màu trầm (con đề xuất)'],
  ['D_ink', 'D · Mực', 'Phác thảo mực + màu nước']
]
const SUBJECTS = [
  ['sprite', 'Sprite 8 hướng (3D, multi-view)', 'Prompt → sprite sheet 8 hướng, mặt sau chuẩn nhất', ['GPU', 'Blender', 'CPU']],
  ['prop', 'Prop 3D (TRELLIS → GLB)', 'Prompt → vật phẩm 3D (GLB có texture)', ['GPU', 'Blender', 'CPU']],
  ['concept', 'Concept 2D (Z-Image)', 'Prompt → ảnh PNG nền trong suốt', ['GPU', 'CPU']]
]
const img = (s, j) => `img/${s}_${j}.webp`
let cur = 3
try { cur = Number(localStorage.getItem('style-pick') ?? 3) } catch {}

function render() {
  const [id, name, desc] = STYLES[cur]
  document.getElementById('styles').innerHTML = STYLES.map((s, i) =>
    `<button role="radio" aria-checked="${i === cur}" class="${i === cur ? 'on' : ''}" data-i="${i}">${s[1]}</button>`).join('')
  document.getElementById('pick').innerHTML = `Đang xem: <b>${name}</b> — ${desc}`
  document.getElementById('cards').innerHTML = SUBJECTS.map(([j, n, p, lanes]) => `
    <div class="rcard"><div class="art"><img src="${img(id, j)}" alt=""></div>
      <div><div class="name">${n}</div><div class="pitch">${p}</div>
      <div class="lanes">${lanes.map((l) => `<span class="lane">${l}</span>`).join('')}</div></div></div>`).join('')
  document.getElementById('tiles').innerHTML = SUBJECTS.map(([j, n]) =>
    `<div class="tile"><div class="img"><img src="${img(id, j)}" alt=""></div><b>${n.split(' (')[0]}</b><span>5 phút trước</span></div>`).join('')
  document.getElementById('big').innerHTML = SUBJECTS.map(([j]) => `<img src="${img(id, j)}" alt="">`).join('')
  document.getElementById('all').innerHTML = STYLES.map(([sid, sn, sd], i) => `
    <div class="all-row ${i === cur ? 'on' : ''}" data-i="${i}"><div><div class="t">${sn}</div><div class="d">${sd}</div></div>
      ${SUBJECTS.map(([j]) => `<img src="${img(sid, j)}" alt="">`).join('')}</div>`).join('')
  try { localStorage.setItem('style-pick', String(cur)) } catch {}
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-i]')
  if (b) { cur = Number(b.dataset.i); render(); return }
  const t = e.target.closest('[data-t]')
  if (t) {
    document.querySelectorAll('#theme button').forEach((x) => x.classList.toggle('on', x === t))
    if (t.dataset.t === 'system') document.documentElement.removeAttribute('data-theme')
    else document.documentElement.dataset.theme = t.dataset.t
  }
})
document.addEventListener('keydown', (e) => {
  const n = Number(e.key)
  if (e.key >= '0' && e.key <= '4') { cur = n; render() }
})
render()
</script>
</body>
</html>
