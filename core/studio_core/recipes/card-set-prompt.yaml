id: card-set-prompt
name: Bộ thẻ bài từ chủ đề (Claude soạn thẻ + art + khung)
description: >-
  Chủ đề game + số thẻ → Claude soạn bộ thẻ cân bằng (tên, luật ngắn, chi phí, công / máu, độ hiếm, loại, prompt art
  tiếng Anh) bằng ngôn ngữ chọn → như "Bộ thẻ bài": Z-Image (hoặc Klein theo ảnh style) vẽ art từng thẻ, CPU vẽ khung
  theo độ hiếm + loại, chữ có dấu tự co vừa ô, mặt sau chung → thẻ 63×88 + atlas + card_set.json + card_list.json (sửa
  tay rồi chạy lại "Bộ thẻ bài") → duyệt. Xuất Unity prefab UGUI + ScriptableObject, Godot scene Control + Resource.
inputs:
  prompt: {type: text, multiline: true, label: Chủ đề / bối cảnh,
           placeholder: "thần thoại Việt Nam: Sơn Tinh, Thủy Tinh, Thánh Gióng, linh vật làng quê"}
  count: {type: int, default: 6, min: 1, max: 40, label: Số thẻ}
  language: {type: text, default: vi, label: "Ngôn ngữ chữ trên thẻ (vi, en, ja…)"}
  types: {type: text, default: "Sinh vật, Phép, Trang bị", label: "Loại thẻ (phẩy, viết đúng như muốn in)"}
  notes: {type: text, multiline: true, required: false, default: "", label: Ghi chú luật / cân bằng,
          placeholder: "mana 1-8, từ khoá: Khiêu khích, Lá chắn, Khi ra sân"}
  style: {type: text, required: false, default: "", label: "Phong cách art (trống = theo dự án / mặc định)"}
  image: {type: image, required: false, label: "Ảnh style tham chiếu (tuỳ chọn → Klein vẽ theo nét này)"}
  art: {type: enum, default: auto, options: [auto, zimage, klein, none],
        label: "Vẽ art (auto = Klein nếu có ảnh style, không thì Z-Image; none = art tạm CPU)"}
  back: {type: text, required: false, default: "ornate symmetrical card back, central glowing emblem, intricate filigree border pattern",
         label: "Mặt sau (mô tả; none = hoa văn CPU)"}
  width: {type: int, default: 756, min: 252, max: 2016, label: "Rộng thẻ (px; cao = rộng × 88 / 63)"}
  review: {type: bool, default: true, label: Duyệt trước khi xong}
steps:
  - id: list
    kind: claude.card_list
    in: {images: inputs.image}
    params: {theme: "${inputs.prompt}", count: "${inputs.count}", language: "${inputs.language}",
             types: "${inputs.types}", notes: "${inputs.notes}", model: opus, _auto_retry: 1}
  - id: art_text
    kind: claude.card_art
    allow_fail: true
    in: {cards: list.json}
    params: {art: "${inputs.art}", model: opus, _auto_retry: 1}
  - id: plan
    kind: op.card_plan
    in: {cards: list.json, ref: inputs.image, art: art_text.json}
    params: {style: "${inputs.style}", art: "${inputs.art}", back: "${inputs.back}"}
  - id: art_z
    kind: comfy.t2i_zimage_turbo
    params:
      "57:27.text": ["${steps.plan.plan.prompts_z}"]
      "57:13.width": 1024
      "57:13.height": 768
      "57:13.batch_size": 1
    map_param: "57:27.text"
  - id: back_z
    kind: comfy.t2i_zimage_turbo
    params:
      "57:27.text": ["${steps.plan.plan.back_z}"]
      "57:13.width": 768
      "57:13.height": 1024
      "57:13.batch_size": 1
    map_param: "57:27.text"
  - id: art_k
    kind: comfy.edit_flux2_klein4b
    in: {image: plan.ref_cards}
    map: image
    params:
      "75:74.text": ["${steps.plan.plan.prompts_k}"]
    map_param: "75:74.text"
  - id: back_k
    kind: comfy.edit_flux2_klein4b
    in: {image: plan.ref_back}
    map: image
    params:
      "75:74.text": ["${steps.plan.plan.back_k}"]
    map_param: "75:74.text"
  - id: render
    kind: op.card_set
    in: {plan: plan.plan, art: [art_z.images, art_k.images], back: [back_z.images, back_k.images]}
    params: {width: "${inputs.width}"}
  - id: approve
    kind: gate.approve
    in: {preview: render.preview, images: render.images, cards: render.cards, list: list.json,
         frames: render.frames, art: render.art, atlas: render.atlas}
    params: {enabled: "${inputs.review}"}
outputs:
  final: approve.images
  preview: approve.preview
  cards: approve.cards
  list: approve.list
  atlas: approve.atlas
