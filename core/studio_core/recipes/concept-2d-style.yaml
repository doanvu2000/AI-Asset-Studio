id: concept-2d-style
name: Concept 2D theo style tham chiếu (Flux.2 Klein)
description: >-
  Ảnh style tham chiếu (Dự án tự điền ảnh tham chiếu của nó) + mỗi dòng 1 vật thể → Klein vẽ vật thể mới cùng nét,
  đổ bóng, bảng màu → chọn → tách nền → căn chỉnh → sprite sheet. Không cần train LoRA.
inputs:
  image: {type: image, label: Ảnh style tham chiếu}
  prompt: {type: text, multiline: true, label: Vật thể (mỗi dòng 1 ảnh),
           placeholder: "a wooden treasure chest\na healing potion bottle"}
  size: {type: int, default: 512, options: [128, 256, 512, 1024]}
steps:
  - id: ref
    kind: op.trim_pad_resize
    in: {images: inputs.image}
    params: {size: 1024, pad: 0.04, background: white}
  - id: gen
    kind: comfy.edit_flux2_klein4b
    in: {image: ref.images}
    params:
      "75:74.text": "Draw a completely new picture: ${inputs.prompt | lines}. Use exactly the same art style as the reference image: the same line work, outline thickness, shading, colour palette, proportions and rendering technique. The reference image is only a style sample: do not draw its character, and do not reuse its clothes, hat, hair, accessories or props. One single subject, centered, full view, on a plain white background."
    map_param: "75:74.text"
  - id: pick
    kind: gate.pick
    in: {images: gen.images}
    params: {k: 0}
  - id: rmbg
    kind: comfy.remove_bg_birefnet
    in: {image: pick.images}
    map: image
  - id: fit
    kind: op.trim_pad_resize
    in: {images: rmbg.images}
    params: {size: "${inputs.size}", pad: 0.06}
  - id: sheet
    kind: op.sheet
    in: {images: fit.images}
outputs:
  final: fit.images
  sheet: sheet.sheet
