id: pbr-material
name: Vật liệu PBR từ texture
description: >-
  Ảnh albedo (vd texture liền mạch, ô tileset) → height từ độ sáng (làm mịn, bỏ ánh sáng loang) → normal (Sobel
  trên height) → roughness (tối + nhiều chi tiết = nhám) → metallic (mặc định 0, tuỳ chọn đoán vùng kim loại) → AO từ
  hốc của height → lưới xem trước 2×3 → duyệt. Lọc vòng qua mép nên map vẫn lặp liền mạch. Chạy CPU, không cần GPU.
  Xuất Unity (URP Lit .mat) / Godot (StandardMaterial3D .tres) gắn sẵn map.
inputs:
  image: {type: image, label: Ảnh albedo (texture)}
  normal_strength: {type: float, default: 3.0, min: 0.1, max: 32, label: Độ nổi normal}
  blur: {type: int, default: 1, min: 0, max: 32, label: Làm mịn độ cao (px)}
  invert_height: {type: bool, default: false, label: "Đảo độ cao (vùng tối là nổi)"}
  roughness: {type: float, default: 0.75, min: 0, max: 1, label: Độ nhám trung bình}
  roughness_contrast: {type: float, default: 0.5, min: 0, max: 2, label: Độ tương phản độ nhám}
  metallic: {type: enum, default: none, options: [none, auto], label: "Metallic (none = 0, auto = đoán vùng kim loại)"}
  metallic_level: {type: float, default: 1.0, min: 0, max: 1, label: Mức metallic (auto)}
  ao_strength: {type: float, default: 0.6, min: 0, max: 1, label: Độ đậm AO}
  seamless: {type: bool, default: true, label: "Giữ liền mạch (tắt nếu ảnh không lặp)"}
  review: {type: bool, default: true, label: Duyệt trước khi xong}
steps:
  - id: pbr
    kind: op.pbr
    in: {images: inputs.image}
    params: {normal_strength: "${inputs.normal_strength}", blur: "${inputs.blur}",
             invert_height: "${inputs.invert_height}", roughness: "${inputs.roughness}",
             roughness_contrast: "${inputs.roughness_contrast}", metallic: "${inputs.metallic}",
             metallic_level: "${inputs.metallic_level}", ao_strength: "${inputs.ao_strength}",
             seamless: "${inputs.seamless}"}
  - id: approve
    kind: gate.approve
    in: {preview: pbr.preview, maps: pbr.maps, material: pbr.material}
    params: {enabled: "${inputs.review}"}
outputs:
  final: approve.maps
  preview: approve.preview
  material: approve.material
