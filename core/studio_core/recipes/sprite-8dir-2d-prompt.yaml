id: sprite-8dir-2d-prompt
name: Sprite 8 hướng 2D từ prompt (Z-Image → Qwen)
description: >-
  Prompt → N concept mặt trước (Z-Image) → chọn 1 → Qwen multi-angle 8 hướng (0,45..315°) → tách nền → chuẩn hoá →
  sheet 8 cột. Góc chỉ gần đúng (P0) — dùng xem concept nhiều phía; sprite thật dùng R5.
inputs:
  prompt: {type: text, label: Prompt}
  count: {type: int, default: 4, min: 1, max: 8, label: Số concept}
  size: {type: int, default: 512, options: [128, 256, 512, 1024]}
  preset: {type: preset, default: studio, label: Preset xuất}
  fx_shadow: {type: enum, default: none, options: [none, drop, blob], label: Bóng đổ (hậu kỳ)}
  fx_outline: {type: enum, default: none, options: [none, "#000000", "#ffffff"], label: Viền hậu kỳ}
  fx_width: {type: int, default: 1, options: [1, 2, 3, 4], label: Độ dày viền hậu kỳ (px)}
steps:
  - id: gen
    kind: comfy.t2i_zimage_turbo
    params: {"57:27.text": "${inputs.prompt}, full body, front view, standing, isolated on plain white background, centered, game asset",
             "57:13.batch_size": "${inputs.count}"}
  - id: pick
    kind: gate.pick
    in: {images: gen.images}
    params: {k: 1}
  - id: angles
    kind: comfy.multi_angles_qwen2511
    in: {image: pick.images}
    # Same branch → angle assignment as sprite-8dir-2d.yaml; front = picked concept.
    params:
      "_drop_outputs": ["373"]
      "427:246:228.prompt": "Rotate the camera 45 degrees to the right."
      "427:271:253.prompt": "Rotate the camera 90 degrees to the right."
      "427:346:328.prompt": "Rotate the camera 135 degrees to the right."
      "427:296:278.prompt": "Rotate the camera 180 degrees to show the back view."
      "427:321:303.prompt": "Rotate the camera 135 degrees to the left."
      "427:371:353.prompt": "Rotate the camera 90 degrees to the left."
      "427:423:405.prompt": "Rotate the camera 45 degrees to the left."
  - id: rmbg
    kind: comfy.remove_bg_birefnet
    in: {image: [pick.images, angles.images]}
    map: image
  - id: norm
    kind: op.normalize
    in: {images: rmbg.images}
    params: {size: "${inputs.size}", pad: 0.06, anchor: bottom}
  - id: fx
    kind: op.sprite_fx
    in: {images: norm.images}
    params: {shadow: "${inputs.fx_shadow}", outline: "${inputs.fx_outline}", width: "${inputs.fx_width}"}
  - id: sheet
    kind: op.sheet
    in: {images: fx.images}
    params: {cols: 8, order: [0, 45, 90, 135, 180, 225, 270, 315], preset: "${inputs.preset}"}
outputs:
  final: fx.images
  sheet: sheet.sheet
