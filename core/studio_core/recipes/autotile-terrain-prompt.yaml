id: autotile-terrain-prompt
name: Autotile địa hình 47 ô (texture A + prompt B, Z-Image)
description: >-
  Texture địa hình A có sẵn (cỏ) + prompt vật liệu nền B (đất, nước, cát) → Z-Image vẽ vài ảnh B nhìn thẳng từ trên →
  chọn 1 → làm liền mạch → CPU vẽ bộ blob 47 ô A trên nền B + 1 ô B đầy, ô cạnh nhau khớp mép theo cấu tạo → bản đồ
  ngẫu nhiên vẽ bằng chính bộ ô để soi mối nối → duyệt. Xuất Godot 4 (TileSet terrain) và Unity (RuleTile).
inputs:
  tile_a: {type: image, label: Texture A (địa hình phủ lên, vd cỏ)}
  prompt_b: {type: text, label: Vật liệu nền B, placeholder: "dry cracked dirt with small pebbles"}
  terrains: {type: text, default: "grass, dirt", label: "Tên 2 địa hình (A, B)"}
  count: {type: int, default: 3, min: 1, max: 6, label: Số ảnh B để chọn}
  size: {type: int, default: 32, options: [16, 32, 64, 128], label: Cỡ ô (px)}
  pixel: {type: bool, default: false, label: Pixel art (mép cứng, không khử răng cưa)}
  colors: {type: int, default: 0, options: [0, 8, 16, 24, 32], label: "Giới hạn số màu pixel art (0 = tắt)"}
  edge: {type: enum, default: organic, options: [smooth, organic, rough], label: Kiểu mép}
  border: {type: float, default: 0.3, min: 0.1, max: 0.4, label: Độ lấn của B vào ô A (tỉ lệ ô)}
  rim: {type: float, default: 0.06, min: 0, max: 0.15, label: "Viền tối mép A (tỉ lệ ô, 0 = tắt)"}
  seed: {type: int, default: 0, min: 0, label: Seed hình mép}
  review: {type: bool, default: true, label: Duyệt trước khi xong}
steps:
  - id: gen
    kind: comfy.t2i_zimage_turbo
    params: {"57:27.text": "${inputs.prompt_b}, seamless tileable game terrain texture, one continuous ground surface photographed straight down from directly above, orthographic, no perspective, flat even diffuse lighting, no shadows, no vignette, natural irregular variation, no tile grid, no seams, no borders, fills the whole frame",
             "57:13.batch_size": "${inputs.count}", "57:13.width": 1024, "57:13.height": 1024}
  - id: pick
    kind: gate.pick
    in: {images: gen.images}
    params: {k: 1}
  - id: seam
    kind: op.seamless
    in: {images: pick.images}
    params: {flatten: 0.5, name: terrain_b}
  - id: tiles
    kind: op.autotile
    in: {tile_a: inputs.tile_a, tile_b: seam.images}
    params: {terrains: "${inputs.terrains}", size: "${inputs.size}", pixel: "${inputs.pixel}",
             colors: "${inputs.colors}", edge: "${inputs.edge}", border: "${inputs.border}", rim: "${inputs.rim}",
             seed: "${inputs.seed}"}
  - id: approve
    kind: gate.approve
    in: {images: tiles.images, preview: tiles.preview, autotile: tiles.autotile}
    params: {enabled: "${inputs.review}"}
outputs:
  final: approve.images
  preview: approve.preview
  autotile: approve.autotile
