id: iso-prop
name: Prop isometric 2:1 (GLB → Blender)
description: >-
  Mesh GLB (từ prop-3d hoặc có sẵn) → dọn mesh → Blender camera ortho đúng góc iso 2:1 (nghiêng 30°, xoay 45°), chân
  đế vừa N×N ô theo bề ngang tile, đèn 3 điểm, nền trong → 4 hướng quay 90° (SW, SE, NE, NW) → sprite neo chân ở tâm
  ô trước + kiểm không tràn ra ngoài ô + xem thử đứng trên lưới → duyệt. Xuất Unity Tile (Tilemap Isometric 1×0.5,
  sort trục Y), Godot TileSet isometric y-sort.
inputs:
  mesh: {type: mesh, label: Mesh GLB}
  tile: {type: int, default: 128, options: [64, 128, 256], label: "Bề ngang ô iso (px, cao = ½)"}
  cells: {type: int, default: 1, min: 1, max: 4, label: "Chiếm N×N ô"}
  upright: {type: enum, default: none, options: [none, x90, x-90, y90, y-90, x180], label: Dựng đứng}
  asset: {type: text, default: "", required: false, label: "Tên asset (trống = tên mesh)"}
  review: {type: bool, default: true, label: Duyệt trước khi xong}
steps:
  - id: cleanup
    kind: blender.cleanup
    in: {mesh: inputs.mesh}
    params: {target_faces: 50000, height: 1.0, origin: feet, upright: "${inputs.upright}"}
  - id: render
    kind: blender.iso_render
    in: {mesh: cleanup.meshes}
    params: {tile_w: "${inputs.tile}", cells: "${inputs.cells}"}
  - id: prop
    kind: op.iso_prop
    in: {images: render.images, json: render.meta}
    params: {asset: "${inputs.asset}"}
  - id: approve
    kind: gate.approve
    in: {images: prop.images, preview: prop.preview, strip: prop.strip, iso: prop.iso}
    params: {enabled: "${inputs.review}"}
outputs:
  final: approve.images
  preview: approve.preview
  strip: approve.strip
  iso: approve.iso
