id: icon-pack
name: Bộ icon cùng style (Z-Image + Flux.2 Klein)
description: >-
  Mỗi dòng 1 icon + mô tả style (khung, viền, bóng) → Z-Image vẽ thử từng icon → chọn 1 icon làm mẫu style → Klein
  vẽ lại cả bộ theo đúng mẫu đó (cùng khung, nét viền, đổ bóng, bảng màu) → tách nền → căn cỡ → viền/bóng tuỳ chọn →
  sheet → duyệt. Xuất Unity/Godot thành từng sprite.
inputs:
  prompt: {type: text, multiline: true, label: Icon (mỗi dòng 1 icon),
           placeholder: "a health potion\na steel sword\na gold coin"}
  style: {type: text, label: Style chung, default: "fantasy RPG inventory icon, rounded square bronze frame, thick dark outline, soft painted shading"}
  size: {type: int, default: 128, options: [64, 128, 256, 512]}
  outline: {type: text, default: none, label: "Viền ngoài thêm (none / #rrggbb)"}
rules:
  - max_lines: {prompt: 24}
steps:
  - id: draft
    kind: comfy.t2i_zimage_turbo
    params:
      "57:27.text": "A single game icon of ${inputs.prompt | lines}. ${inputs.style}. One icon centered, filling most of the image, on a plain pure white background, no text, no letters."
    map_param: "57:27.text"
  - id: pick
    kind: gate.pick
    in: {images: draft.images}
    params: {k: 1}
  - id: ref
    kind: op.trim_pad_resize
    in: {images: pick.images}
    params: {size: 1024, pad: 0.04, background: white}
  - id: gen
    kind: comfy.edit_flux2_klein4b
    in: {image: ref.images}
    params:
      "75:74.text": "Replace only the object inside the icon with ${inputs.prompt | lines}. Keep the icon frame of the reference image exactly as it is: the same frame shape, border, colour, size and position, and the same background inside the frame. Draw the new object in exactly the same style as the old one: the same outline thickness, shading, lighting and colour palette, the same size inside the frame. One single icon, centered, on a plain pure white background, no text."
    map_param: "75:74.text"
  - id: rmbg
    kind: comfy.remove_bg_birefnet
    in: {image: gen.images}
    map: image
  - id: fit
    kind: op.trim_pad_resize
    in: {images: rmbg.images}
    params: {size: "${inputs.size}", pad: 0.04}
  - id: fx
    kind: op.sprite_fx
    in: {images: fit.images}
    params: {outline: "${inputs.outline}"}
  - id: icons
    kind: op.nine_slice
    in: {images: fx.images}
    params: {slice: false, states: none, names: "${inputs.prompt}"}
  - id: sheet
    kind: op.sheet
    in: {images: icons.images}
    params: {cols: 8}
  - id: approve
    kind: gate.approve
    in: {sheet: sheet.sheet, images: icons.images, slices: icons.slices}
outputs:
  final: icons.images
  sheet: sheet.sheet
  slices: icons.slices
