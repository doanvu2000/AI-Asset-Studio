id: sprite-8dir-3d-pixel
name: Sprite 8 hướng pixel art (3D)
description: Text → concept → chọn → TRELLIS mesh → Blender dọn mesh → render 8 hướng ortho → pixel art (bảng màu chung, viền 1px) → sprite sheet (pivot = tâm chân) + JSON + bảng màu; bóng/viền hậu kỳ (tuỳ chọn) có cạnh cứng, bóng dither, màu của chúng nằm ngoài bảng màu
inputs:
  prompt: {type: text, label: Prompt}
  elevation: {type: int, default: 30, options: [30, 45, 60, 90], label: Góc nghiêng}
  pixel: {type: int, default: 64, options: [32, 48, 64, 96, 128], label: Cỡ pixel art (px)}
  colors: {type: int, default: 16, options: [8, 12, 16, 24, 32], label: Số màu}
  palette: {type: enum, default: auto, options: [auto, pico8, sweetie16, db16, db32, endesga32], label: Bảng màu}
  outline: {type: enum, default: dark, options: [dark, none, "#000000"], label: Viền ngoài}
  dither: {type: enum, default: none, options: [none, bayer], label: Dither}
  mirror: {type: bool, default: false, label: Lật gương (5 hướng → 8)}
  faces: {type: int, default: 30000, min: 2000, max: 200000, label: Số mặt}
  preset: {type: preset, default: pixel, label: Preset xuất}
  fx_shadow: {type: enum, default: none, options: [none, drop, blob], label: Bóng đổ (hậu kỳ)}
  fx_outline: {type: enum, default: none, options: [none, "#000000", "#ffffff"], label: Viền hậu kỳ}
  fx_width: {type: int, default: 1, options: [1, 2, 3, 4], label: Độ dày viền hậu kỳ (px)}
steps:
  - id: concept
    kind: comfy.t2i_zimage_turbo
    params: {"57:27.text": "${inputs.prompt}, single full-body character, front view facing the camera, standing upright, whole figure visible head to feet, isolated on plain white background, centered, game asset",
             "57:13.batch_size": 4}
  - id: pick
    kind: gate.pick
    in: {images: concept.images}
    params: {k: 1}
  - id: mesh
    kind: comfy.img2mesh_trellis2_textured
    in: {image: pick.images}
    params: {"186.target_face_count": "${inputs.faces}", "288.value": 2048, "94.target_resolution": 1024, "241.resolution": 512, _free_before: true, _timeout_s: 900}
  - id: cleanup
    kind: blender.cleanup
    in: {mesh: mesh.meshes}
    params: {target_faces: "${inputs.faces}", height: 1.0, origin: feet, upright: none}
  - id: render
    kind: blender.render_dirs
    in: {mesh: cleanup.meshes}
    params: {count: 8, elevation: "${inputs.elevation}", res: 256, supersample: 2, mirror: "${inputs.mirror}"}
  - id: dirs
    kind: op.mirror_dirs
    in: {images: render.images}
    params: {count: 8}
  - id: pixel
    kind: op.pixel_art
    in: {images: dirs.images}
    params: {size: "${inputs.pixel}", colors: "${inputs.colors}", palette: "${inputs.palette}",
             outline: "${inputs.outline}", dither: "${inputs.dither}"}
  - id: fx
    kind: op.sprite_fx
    in: {images: pixel.images, pivot: render.meta}
    params: {shadow: "${inputs.fx_shadow}", outline: "${inputs.fx_outline}", width: "${inputs.fx_width}", pixel: true}
  - id: sheet
    kind: op.sheet
    in: {images: fx.images, pivot: render.meta}
    params: {cols: 8, order: [0, 45, 90, 135, 180, 225, 270, 315], preset: "${inputs.preset}"}
outputs:
  final: sheet.sheet
  meta: sheet.meta
  frames: fx.images
  palette: pixel.palette
  swatch: pixel.swatch
