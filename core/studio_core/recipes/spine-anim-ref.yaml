id: spine-anim-ref
name: Thêm anim Spine từ video tham chiếu
description: >-
  Skeleton Spine 4.2 có sẵn + atlas + video tham chiếu + mô tả → trích frame → hàn khớp cứng (da/áo quanh khuỷu,
  cổ tay thành mesh weight 2 bone để không lộ mối nối) → Claude viết motion spec → thêm anim vào skeleton → render
  strip → Claude chấm so với video và sửa spec, lặp tới khi đạt điểm → duyệt. Không dùng GPU.
inputs:
  skeleton: {type: file, ext: [json], label: Skeleton JSON gốc}
  atlas: {type: file, ext: [atlas, txt], siblings: atlas_pages, label: "Atlas (các trang png cùng thư mục tự đi kèm)"}
  video: {type: video, label: Video tham chiếu}
  anim_id: {type: text, default: sway, label: Tên anim}
  brief: {type: text, multiline: true, label: Mô tả + trigger, placeholder: "Nhấc một tay, lắc hông nhẹ, chớp mắt..."}
  ref_window: {type: text, default: auto, label: "Đoạn video (vd 1.6-5.6 hoặc auto)"}
  skin_parts: {type: text, default: auto, label: "Skin ghép để render (auto = skin đầu mỗi nhóm | skin,skin)"}
  weld_joints: {type: text, default: auto, label: "Khớp hàn mesh weight (auto | none | bone,bone)"}
  skirt_chains: {type: text, default: auto, label: "Chuỗi xương váy (auto | none | a>b>c;d>e>f)"}
  skirt_views: {type: text, default: auto, label: "Skin váy/đầm để soi (auto | none | skin,skin)"}
  joint_cover: {type: text, default: auto, label: "Khớp được trang phục che (auto | none | bone,bone)"}
  rounds: {type: int, default: 3, min: 1, max: 6, label: Số vòng chấm tối đa}
  accept_score: {type: float, default: 8, min: 0, max: 10, label: Điểm chấp nhận}
steps:
  - id: frames
    kind: op.video_frames
    in: {video: inputs.video}
    params: {fps: 4, window: "${inputs.ref_window}", tile: "8x2", crop: auto}
  - id: weld
    kind: op.spine_weld_joints
    in: {skeleton: inputs.skeleton}
    params: {joints: "${inputs.weld_joints}"}
  - id: skirt
    kind: op.spine_skirt_mesh
    in: {skeleton: weld.skeleton}
    params: {chains: "${inputs.skirt_chains}"}
  - id: rig
    kind: op.spine_rig_summary
    in: {skeleton: skirt.skeleton, welded: weld.joints}
    params: {skin: "${inputs.skin_parts}", joint_cover: "${inputs.joint_cover}"}
  - id: spec
    kind: claude.task
    in: {images: frames.sheets}
    params:
      model: opus
      max_turns: 2
      _auto_retry: 1
      schema: motion_spec
      system: >-
        You are a senior Spine 2D animator. You write a procedural motion spec that a generator turns into Spine
        keyframes. Spine is y-up, positive rotation = CCW; rotate/translate keys are offsets from setup pose, scale
        keys are absolute.
      prompt: |
        The images are frames of a reference video (contact sheets, row-major tiles labelled "#index time").
        Tiles were sampled at ${steps.frames.meta.fps} fps starting at video time ${steps.frames.meta.t0}s.
        Brief: ${inputs.brief}
        Animation name: ${inputs.anim_id}
        Rig:
        ${steps.rig.summary}
        Spec semantics: sway_signal = normalized driver keys [time, -1..1]; hip translate x = hip.shift_x*s,
        y = -hip.dip_y*|s|; hip rotate = hip.tilt*s; spine/chest/neck/head follow s with upper_body gains and lag;
        arm_keys = {bone: [[time, rotate offset], ...]} for any bone (use the arm/forearm/hand bones from the rig);
        secondary = chains from the rig's "Chains" line: rotate = gain*(1+falloff*i)*s delayed lag*(i+1);
        blinks = times of eye close (eye scaleX -> blink_closed_scale, see the rig's blink line).
        First pick the motion type from the reference and the brief:
        - sway / idle / gesture in place (the body stays over its feet): the sway fields below, clip starts and
          ends at setup pose.
        - walk or run (feet step in a repeating pattern): set cycle = {type: walk|run, facing: side if the
          character is seen from the side else front, direction: 1 if it moves toward image right else -1,
          period = seconds per full cycle (two steps) measured in the reference} and duration = a whole number
          of periods; tune stride/lift/bob/arm_swing/lean (leg lengths / degrees) only where the reference
          differs from the defaults. It loops and moves in place (no root travel).
        - jump in place (both feet leave the ground together): set jump = {facing, direction, takeoff and land =
          seconds when the feet leave and touch the ground in the reference, height = how far the hip rises above
          standing at the peak, in leg lengths} and leave the rest to defaults unless the reference differs; it ends at setup pose. Add
          keys only for what the preset does not move (weapon, cape).
        - melee attack, hit reaction or death: set action = {type: attack|hit|death, facing, direction, at =
          seconds of the strike (attack) or of the impact (hit, death) in the reference}; tune swing/lean/step
          (attack), recoil/push (hit), fall/drop/slump (death) only where the reference differs. Attack and hit
          return to setup; death ends holding the collapsed pose. Add keys only for what the preset does not move.
        - other one-shot action (kick, sit, fall, cast): use keys = {bone: {rotate|translate|scale: [[t, ...]]}}
          on the bones that act: leg IK targets from the rig's IK line for the feet (translate, y up), the hip
          for crouch/rise, arms and weapon; anticipation before the action, overshoot and settle after. Feet
          that stay on the ground keep their IK targets still.
        Set loop true for any clip meant to repeat (idle loops too). Without loop every key list starts at time 0
        with value 0 and ends at or before duration-0.3 with value 0, so the clip starts and ends at setup pose;
        hold true instead keeps the last keys as the final pose (a fall, a knockdown, a pose to blend from).
        Time 0 of the clip is where the motion starts in the video. Unused sway fields may be left out.
        The rig's "Torso the sway drives" line names the hip/spine/chest/neck/head/eye bones the generator keys;
        if a role is wrong for this rig, set bones = {role: bone} (eyes = [bones]); otherwise leave bones out.
        Mind screen direction: the character faces the viewer, so its left side (_L bones) is on the image right
        unless the rig angles say otherwise.
        Joints listed as "hard seam" in the rig (separate images, e.g. elbows and wrists) show a sharp corner when
        bent far: keep their arm_keys inside the listed offset range (the generator clamps anything outside it), and
        express a bigger gesture through the shoulder/upper arm instead. A "welded" joint (skin and clothing are
        2-bone weighted meshes there) or a hard seam "covered by" clothing shows no seam, so bend it: elbows slightly bent at rest, the forearm lifts further when the arm rises, the wrist
        flicks (within about ±25° of setup); avoid stick-straight arms. arm_lag = {bone: seconds} lets forearm and
        hand trail the upper arm.
        bounce = [[time, depth_px], ...] lists only the dips (no [0, 0] or end anchors; the generator returns to
        setup by itself) and lowers the rig's "Hip for bounce" bone at each one (the leg IK bends the knees). Count
        the dips in the reference over the WHOLE clip and follow any count in the brief exactly. Each dip lands on
        a hip extreme (time = that sway_signal extreme), but not every extreme gets one: a sway with several hip
        swings may still dip only twice. Never dip continuously. Use a depth of about 1% of the leg length;
        with bounce set, keep hip.dip_y 0. Keep hip.shift_x modest so the knees never touch or cross.
        Overlap makes motion fluid: leave graph "smooth"; set offset.arms ~0.04 (the arms start after the body) and
        offset.hip_tilt ~0.03; upper_body.lag ~0.1 (each torso level trails the one below); secondary (hair) lag about
        1.35x the torso step. Avoid two equal keys in a row on an arm (a dead hold); let it drift a few degrees.
        Skirt chains, fingers and held accessories are generated by the rig (spring, follow, gravity): do not key
        them in arm_keys or secondary.
        Write the full spec.
  - id: review
    kind: claude.spine_review_loop
    in: {skeleton: skirt.skeleton, atlas: inputs.atlas, ref: frames.sheets, spec: spec.json, rig: rig.summary,
         ref_meta: frames.meta, welded: weld.joints}
    params:
      name: "${inputs.anim_id}"
      brief: "${inputs.brief}"
      rounds: "${inputs.rounds}"
      accept_score: "${inputs.accept_score}"
      skin: "${inputs.skin_parts}"
      joint_cover: "${inputs.joint_cover}"
      skirt: "${inputs.skirt_chains}"
      skirt_views: "${inputs.skirt_views}"
      model: opus
      _timeout_s: 600
  - id: approve
    kind: gate.approve
    in: {skeleton: review.skeleton, strip: review.strip, ref: frames.sheets, review: review.review,
         spec: review.spec}
outputs:
  skeleton: approve.skeleton
  strip: approve.strip
  spec: approve.spec
  review: approve.review
  anim: review.anim
