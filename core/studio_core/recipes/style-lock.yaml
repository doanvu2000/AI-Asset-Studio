id: style-lock
name: Khoá style toàn Dự án (kiểm độ lệch + sửa 1 chạm)
description: >-
  Dự án (mọi ảnh đã duyệt) + 1-3 ảnh mỏ neo style → đo từng asset (khoảng cách CLIP nếu có model, ΔE2000 bảng màu so
  với mỏ neo, tương phản, độ bão hoà, độ dày viền) → bảng xếp hạng lệch (style_lock.json) + ảnh lưới so sánh; ngưỡng
  "lệch" theo phân bố của chính Dự án (trung vị + k·MAD). Lệch màu → chuyển palette bằng LUT dựng từ mỏ neo (CPU).
  Lệch nét / chất → gửi Flux.2 Klein vẽ lại chỉ những asset lệch (mặc định tắt, bật "Vẽ lại asset lệch nét"). Kết quả
  là version mới, không ghi đè version cũ → duyệt.
inputs:
  project: {type: text, required: false, default: "", label: "Dự án (tên hoặc id, trống = dự án của run này)"}
  anchor: {type: image, label: Ảnh mỏ neo style}
  anchor_2: {type: image, required: false, label: Ảnh mỏ neo 2 (tuỳ chọn)}
  anchor_3: {type: image, required: false, label: Ảnh mỏ neo 3 (tuỳ chọn)}
  k: {type: float, default: 3.0, min: 1, max: 10, label: "Độ nghiêm ngưỡng lệch (k trong trung vị + k·MAD)"}
  clip: {type: bool, default: true, label: "Đo thêm khoảng cách CLIP (bỏ qua nếu chưa có model)"}
  recolor: {type: bool, default: true, label: "Sửa asset lệch màu bằng LUT (CPU)"}
  strength: {type: float, default: 0.6, min: 0, max: 1, label: "Độ kéo về bảng màu mỏ neo (0 = chỉ dời trung bình)"}
  restyle: {type: bool, default: false, label: "Vẽ lại asset lệch nét / chất bằng Klein (GPU, mặc định tắt)"}
  style: {type: text, default: "", multiline: true, label: Mô tả style đích cho Klein (trống = theo mỏ neo chung),
          placeholder: "cozy hand-painted fantasy, soft cel shading, warm palette, thin dark outline"}
  max_assets: {type: int, default: 200, min: 1, max: 2000, label: Số asset tối đa đem đo}
  review: {type: bool, default: true, label: Duyệt trước khi xong}
steps:
  - id: audit
    kind: op.style_audit
    in: {anchors: [inputs.anchor, inputs.anchor_2, inputs.anchor_3]}
    params: {project: "${inputs.project}", k: "${inputs.k}", clip: "${inputs.clip}", recolor: "${inputs.recolor}",
             strength: "${inputs.strength}", restyle: "${inputs.restyle}", style: "${inputs.style}",
             max_assets: "${inputs.max_assets}"}
  # Empty restyle_in (restyle off, or nothing off-style) means ComfyUI is never called.
  - id: edit
    kind: comfy.edit_flux2_klein4b
    in: {image: audit.restyle_in}
    map: image
    params:
      "75:74.text": ["${steps.audit.layout.prompts}"]
    map_param: "75:74.text"
  - id: finish
    kind: op.style_lock_finish
    in: {recolored: audit.recolored, sources: audit.sources, edits: edit.images, report: audit.report,
         layout: audit.layout}
  - id: approve
    kind: gate.approve
    in: {preview: finish.preview, images: finish.images, report: finish.report, ranking: audit.preview}
    params: {enabled: "${inputs.review}"}
outputs:
  final: approve.images
  preview: approve.preview
  report: approve.report
  ranking: approve.ranking
