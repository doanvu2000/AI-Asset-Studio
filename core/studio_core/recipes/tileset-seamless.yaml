id: tileset-seamless
name: Tileset biến thể liền mạch (Z-Image)
description: Prompt vật liệu → N ảnh Z-Image → edge = ảnh đầu làm liền mạch, các ảnh sau mượn mép của nó (lát trộn lẫn được); wang = 2 vật liệu (dòng 1, dòng 2 — hoặc 2 biến thể của 1 vật liệu) thành bộ Wang góc 16 ô, xếp kiểu gì khớp nhãn góc cũng liền → chấm điểm + xem lát → normal map → duyệt
inputs:
  prompt: {type: text, multiline: true, label: "Vật liệu (Wang: dòng 2 = vật liệu thứ hai)", placeholder: "lush green grass\ndry dirt path"}
  mode: {type: enum, default: edge, options: [edge, wang], label: "Kiểu bộ ô (edge = chung mép, wang = góc 2 vật liệu)"}
  count: {type: int, default: 4, min: 1, max: 8, label: Số ảnh mỗi vật liệu}
  size: {type: int, default: 512, options: [128, 256, 512, 1024], label: Cỡ ô (px)}
  flatten: {type: float, default: 0.5, min: 0, max: 1, label: San phẳng ánh sáng}
  normal: {type: bool, default: true, label: Tạo normal map}
  review: {type: bool, default: true, label: Duyệt trước khi xong}
rules:
  - when: {mode: wang}
    min_items: {lines: prompt, times: count, min: 2}
    message: "Wang cần 2 dòng vật liệu, hoặc số ảnh mỗi vật liệu ≥ 2"
  - when: {mode: wang}
    max_lines: {prompt: 2}
  - when: {mode: edge}
    max_lines: {prompt: 1}
steps:
  - id: gen
    kind: comfy.t2i_zimage_turbo
    params: {"57:27.text": "${inputs.prompt | lines}, seamless tileable texture, one continuous surface photographed straight down from directly above, orthographic, no perspective, no vanishing point, flat even diffuse lighting, no shadows, no vignette, natural irregular variation, every detail unique and non-repeating, no tile grid, no seams, no borders, fills the whole frame, game texture",
             "57:13.batch_size": "${inputs.count}"}
    map_param: "57:27.text"
  - id: seam
    kind: op.seamless
    in: {images: gen.images}
    params: {match_edges: true, mode: "${inputs.mode}", group: "${inputs.count}", flatten: "${inputs.flatten}", name: tile}
  - id: wang
    kind: op.tile_wang
    in: {images: seam.images}
    params: {mode: "${inputs.mode}", size: "${inputs.size}", normal: "${inputs.normal}"}
  - id: fit
    kind: op.tile_resize
    in: {images: wang.images}
    params: {size: "${inputs.size}", levels: 0, square: true}
  - id: nmap
    kind: op.tile_normal
    in: {images: fit.images, nmap: wang.nmap}
    params: {enabled: "${inputs.normal}"}
  - id: check
    kind: op.tile_check
    in: {images: fit.images, nmap: nmap.images, atlas: wang.atlas, wang: wang.wang}
    params: {grid: 4}
  - id: approve
    kind: gate.approve
    in: {images: check.images, preview: check.preview, report: check.report, atlas: check.atlas, nmap: check.nmap,
         wang: check.wang}
    params: {enabled: "${inputs.review}"}
outputs:
  final: approve.images
  preview: approve.preview
  report: approve.report
  atlas: approve.atlas
  nmap: approve.nmap
  wang: approve.wang
