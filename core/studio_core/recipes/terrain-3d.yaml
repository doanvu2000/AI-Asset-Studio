id: terrain-3d
name: Địa hình 3D (Claude + Z-Image)
description: >-
  Mô tả địa hình → Claude (Opus) đặt vùng núi / đồi / cao nguyên / đồng bằng / thung lũng / hồ / biển + sông lên bản
  đồ và chọn 4 lớp vật liệu (nền, ven nước, vách đá, đỉnh) → heightmap 16-bit 1025/2049 chạy CPU (fBm + uốn miền,
  xói mòn dòng chảy nhẹ, sông khắc theo spline, dither nên không bậc thang) + splat 4 kênh theo độ cao / độ dốc / mép
  nước (tổng đúng 255) → Z-Image vẽ 4 texture liền mạch → bộ map PBR → tuỳ chọn skybox 360 cùng prompt (Qwen-Image)
  → ảnh xem phối cảnh có texture + bản đồ → duyệt. Xuất Unity (script dựng TerrainData + 4 TerrainLayer + prefab +
  scene mẫu, có mặt nước), Godot 4 (mesh chia chunk 3 mức LOD + shader splat 4 lớp + HeightMapShape3D), kèm .raw 16-bit
  và PNG 16-bit cho engine khác.
inputs:
  idea: {type: text, multiline: true, label: Mô tả địa hình,
         placeholder: "đảo núi lửa, hồ trên cao nguyên phía đông, sông chảy ra biển phía nam, rừng thông ven núi"}
  style: {type: text, required: false, default: "", label: Phong cách (tuỳ chọn)}
  size: {type: int, default: 1025, options: [1025, 2049], label: Độ phân giải heightmap}
  world: {type: int, default: 1024, min: 64, max: 8192, label: Kích thước thế giới (m)}
  height: {type: int, default: 250, min: 10, max: 3000, label: Chênh cao lớn nhất (m)}
  erosion: {type: float, default: 0.5, min: 0, max: 1, label: Xói mòn (0 = tắt)}
  seed: {type: int, default: 0, min: 0, max: 2147483647, label: "Seed (0 = theo bản đồ)"}
  texture: {type: int, default: 1024, options: [512, 1024], label: Cỡ texture lớp (px)}
  skybox: {type: bool, default: false, label: "Ghép skybox 360 cùng prompt (Qwen-Image, thêm vài phút)"}
  asset: {type: text, default: terrain, label: Tên asset}
  review: {type: bool, default: true, label: Duyệt trước khi xong}
steps:
  - id: plan
    kind: claude.terrain_plan
    params: {idea: "${inputs.idea}", style: "${inputs.style}", skybox: "${inputs.skybox}", model: opus,
             _auto_retry: 1}
  - id: hmap
    kind: op.terrain_height
    in: {plan: plan.json}
    params: {size: "${inputs.size}", world: "${inputs.world}", height: "${inputs.height}",
             erosion: "${inputs.erosion}", seed: "${inputs.seed}", asset: "${inputs.asset}"}
  # One texture per splat layer, in channel order ground, shore, cliff, peak.
  - id: gen
    kind: comfy.t2i_zimage_turbo
    params: {"57:27.text": ["${steps.plan.json.layer_prompts}"], "57:13.batch_size": 1,
             "57:13.width": 1168, "57:13.height": 1168}
    map_param: "57:27.text"
  - id: seam
    kind: op.seamless
    in: {images: gen.images}
    params: {name: layer, flatten: 0.6, grid: auto}
  - id: fit
    kind: op.tile_resize
    in: {images: seam.images}
    params: {size: "${inputs.texture}", levels: 0, square: true}
  - id: mat
    kind: op.pbr
    in: {images: fit.images}
    params: {normal_strength: 3.0, roughness: 0.8}
  # sky_prompts is empty unless the skybox input is on, so this map makes no ComfyUI call by default.
  - id: sky
    kind: comfy.t2i_qwen_image_360
    params: {"6.text": ["${steps.plan.json.sky_prompts}"], "7.text": "${steps.plan.json.sky_negative}",
             "8.batch_size": 1, "3.steps": 30, _free_before: true}
    map_param: "6.text"
  - id: skybox
    kind: op.terrain_sky
    in: {images: sky.images}
    params: {asset: "${inputs.asset}"}
  - id: pack
    kind: op.terrain_pack
    in: {terrain: hmap.terrain, material: mat.material, plan: plan.json, skybox: skybox.skybox}
  - id: approve
    kind: gate.approve
    in: {images: pack.preview, terrain: pack.terrain, heightmap: hmap.heightmap, raw: hmap.raw, splat: hmap.splat,
         maps: mat.maps, masks: pack.masks, skybox: skybox.skybox, sky: skybox.images, faces: skybox.faces,
         irradiance: skybox.irradiance}
    params: {enabled: "${inputs.review}"}
outputs:
  final: approve.images
  terrain: approve.terrain
  heightmap: approve.heightmap
  raw: approve.raw
  splat: approve.splat
  maps: approve.maps
  skybox: approve.skybox
