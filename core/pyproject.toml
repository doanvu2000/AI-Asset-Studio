[project]
name = "studio-core"
dynamic = ["version"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "aiosqlite>=0.20",
    "blake3>=1.0",
    "orjson>=3.10",
    "httpx>=0.27",
    "websockets>=13",
    "pywin32>=306; sys_platform == 'win32'",
    "pillow>=11",
    "numpy>=2",
    "pyyaml>=6",
    "claude-agent-sdk>=0.2",
    "python-multipart>=0.0.32",
    "mcp>=2.3.0",
    "ruamel-yaml>=0.18",
    "sherpa-onnx>=2.0.1",
    "onnxruntime>=1.31.1",
]

[dependency-groups]
dev = [
    "aseprite>=0.1.0",
    "psd-tools>=1.26.0",
    "pyinstaller>=6.22.3",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.8.0",
    "pytmx>=3.32",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: takes more than ~5 s; skip for the quick loop with -m \"not slow\" -n auto",
    "live: needs real GPU/ComfyUI/Blender/Codex; run with -m live",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "studio_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["studio_core"]
